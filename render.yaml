services:
  - type: web
    name: mlima-supplier
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci && npm run db:generate
    startCommand: npm run start:api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        value: https://mlima-supplier.vercel.app
      - key: WEB_ORIGIN
        value: https://mlima-supplier.vercel.app
      - key: WEB_ORIGINS
        value: https://mlima-supplier.vercel.app
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: ADMIN_WHATSAPP_NUMBER
        value: +243993163742